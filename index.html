<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Birthday Card</title>
  <style>
    body {
      margin: 0;
      background: #ffe6f0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      perspective: 1000px;
    }

    .card {
      width: 300px;
      height: 400px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transform-style: preserve-3d;
      transform: rotateY(0deg);
      animation: rotateCard 10s infinite linear;
   
    }


    
    @keyframes rotateCard {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
      100% { transform: rotateY(360deg); }
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      
    }

    .front {
      background: linear-gradient(#ff9a9e, #fad0c4);
      color: #fff;
      
    }

    .back {
      background: #fff5f9;
      color: #333;
      transform: rotateY(180deg);
    }

    .cake {
      width: 100px;
      height: 120px;
      background: #ff66b2;
      border-radius: 10px 10px 5px 5px;
      position: relative;
      box-shadow: 0 4px #e60073;
    }

    .cake::before {
      content: '';
      width: 60px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: -10px;
      left: 20px;
    }

    .flame {
      width: 10px;
      height: 20px;
      background: radial-gradient(circle, yellow, orange, red);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      position: absolute;
      top: -30px;
      left: 45px;
      animation: flicker 1s infinite;
    }

    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(-45deg); opacity: 1; }
      50% { transform: scale(1.1) rotate(-45deg); opacity: 0.8; }
    }

    h1 {
      margin-top: 20px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 2px;
    }

    .name {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #e60073;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="front">
      <div class="cake">
        <div class="flame"></div>
      </div>
      <h1>Happy Birthday</h1>
      <div class="name">🎉 babuuu 🎉</div>
    </div>
    <div class="back">
      <h1>Wishing you joy, love<br>and cake! 🎂💖
    aap meri life ki vo khusi ho jo mai kisi ko na du bahut bahut bahut sara pyar meri jaan i love you very very very much mai hmesa apke sath hu babu 
    aurrrrrrr ye loooo puchi 💋😘
    
    </h1>
    </div>
  </div>
</body>
</html>
